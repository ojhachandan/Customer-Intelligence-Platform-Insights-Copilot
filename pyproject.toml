[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-intelligence-platform"
version = "0.1.0"
description = "Customer segmentation, recommendations, and grounded insights copilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pandera>=0.20,<1",
  "scikit-learn>=1.5,<2",
  "httpx>=0.27,<1",
  "redis>=5,<6",
  "qdrant-client>=1.11,<1.12",
  "mlflow>=2.16,<4",
  "typer>=0.12,<1",
  "langgraph>=0.2,<1",
  "implicit>=0.7,<1",
  "alembic>=1.13,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]
ml = ["sentence-transformers>=3,<4"]

[project.scripts]
cip = "cip.cli:app"

[tool.setuptools.packages.find]
include = ["cip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:typeguard"

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"cip/api.py" = ["B008"]
"cip/cli.py" = ["B008"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.17.3",
]
